[project]
name = "redirectiq-api"
version = "0.1.0"
description = "RedirectIQ backend: fast link redirects, event-driven analytics, and AI-powered insights."
authors = [
    { name = "Mohamed Rashidh", email = "rockrazith9@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "redis>=5.0",
    "python-json-logger>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "app"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# core/db.py and core/redis.py cache the engine/client with @lru_cache, exactly
# like the real api/redirect/worker processes do (one engine per process
# lifetime). A session-scoped loop keeps that assumption true in tests too —
# per-function loops would tear down the loop those cached objects were bound
# to and break on the second test ("Event loop is closed").
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
